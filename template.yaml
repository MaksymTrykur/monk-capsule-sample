namespace: capsule-sample

web:
  defines: runnable
  containers:
    app:
      image: capsule-sample:wild-b
  services:
    http:
      container: app
      port: 80
      protocol: tcp
      ingress-routes:
        web:
          host: <- $ingress-host
          path-prefix: /

stack:
  defines: group
  variables:
    environment:
      type: string
      value: main
    ingress-host:
      type: string
      value: ""
  runnable-list:
    - capsule-sample/web
