namespace: capsule-sample

web:
  defines: runnable
  containers:
    app:
      image: capsule-sample:latest
  services:
    http:
      container: app
      port: 80
      protocol: tcp
      ingress-routes:
        web:
          host: <- `${environment}.fsapvjhxov5fz6ootb.runs.onmonk.io`

stack:
  defines: group
  variables:
    environment:
      type: string
      value: main
  runnable-list:
    - capsule-sample/web
